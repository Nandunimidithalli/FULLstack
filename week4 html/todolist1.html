<!DOCTYPE html>
<html>
<head>
    <title>Simple To-Do List</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background-color: #4cd8ae79;
            text-align: center;
        }

        .container{
            width: 400px;
            margin: 50px auto;
            background: rgb(255, 255, 255);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h2{
            color: rgba(196, 194, 89, 0.877);
        }

        input{
            width: 220px;
            padding: 8px;
            font-size: 16px;
        }

        button{
            padding: 8px 15px;
            background-color: rgb(75, 107, 88);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background-color: green;
        }

        ul{
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        li{
            background: #fffae6;
            margin: 10px;
            padding: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        li button{
            background: red;
            padding: 5px 10px;
        }

        li button:hover{
            background: rgba(139, 0, 0, 0.301);
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Simple To-Do List</h2>

    <input type="text" id="task" placeholder="Enter a task">

    <button onclick="addTask()">Add Task</button>

    <ul id="taskList"></ul>

</div>

<script>

function addTask(){

    let task = document.getElementById("task").value;

    if(task==""){
        alert("Please enter a task");
        return;
    }

    let li = document.createElement("li");

    li.innerHTML = task;

    let btn = document.createElement("button");

    btn.innerHTML = "Delete";

    btn.onclick = function(){
        li.remove();
    };

    li.appendChild(btn);

    document.getElementById("taskList").appendChild(li);

    document.getElementById("task").value="";
}

</script>

</body>
</html>
